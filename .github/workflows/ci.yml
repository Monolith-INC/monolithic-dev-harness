name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install tools
        run: pip install "ruff==0.16.4"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: shellcheck
        run: shellcheck install.sh scripts/build_release.sh plugins/monolithic-dev-harness/bin/* plugins/monolithic-dev-harness/tests/run.sh
      - name: JSON, schema, skills, docs, and links
        run: python scripts/check_repo.py
      - name: Version sources agree
        run: python scripts/check_versions.py
      - name: Markdown
        run: npx --yes markdownlint-cli2@0.23.3

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: pip install pytest
      - name: Git identity for test repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: Run suites
        run: PYTHON=python plugins/monolithic-dev-harness/tests/run.sh

  install:
    name: Build and install the release
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # The runner context is not available in job-level env, so the sandbox paths are set here.
      - name: Sandbox install paths
        run: |
          {
            echo "HARNESS_HOME=$RUNNER_TEMP/harness-home"
            echo "HARNESS_BIN_DIR=$RUNNER_TEMP/harness-bin"
            echo "CURSOR_PLUGIN_DIR=$RUNNER_TEMP/cursor-plugin"
            echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config"
            echo "CODEX_HOME=$RUNNER_TEMP/codex-home"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code and Codex
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate plugins/monolithic-dev-harness
          claude plugin validate .
      - name: Build the release archive
        run: scripts/build_release.sh
      - name: Install into a sandboxed home
        run: |
          bash dist/install.sh --source dist/monolithic-dev-harness-*.tar.gz --host all --yes
          claude plugin list --json | grep -q '"monolithic-dev-harness@monolithic-dev-harness"'
          details="$(claude plugin details monolithic-dev-harness@monolithic-dev-harness)"
          echo "$details" | grep -E "Skills|Agents|Hooks|MCP servers"
          echo "$details" | grep -qE "Hooks \([1-9]" || { echo "hooks were not loaded"; exit 1; }
          echo "$details" | grep -q "MCP servers (3)" || { echo "MCP servers were not loaded"; exit 1; }
          test -f "$CURSOR_PLUGIN_DIR/.cursor-plugin/plugin.json"
          codex plugin list --json | grep -q '"monolithic-dev-harness@monolithic-dev-harness"'
          test -f "$CODEX_HOME/agents/mdh_thermo_review.toml"
          test -f "$CODEX_HOME/agents/mdh_thermo_quality.toml"
          "$HARNESS_BIN_DIR/harness" doctor
      - name: Uninstall cleanly
        run: |
          bash dist/install.sh --uninstall
          ! claude plugin list --json | grep -q '"monolithic-dev-harness@monolithic-dev-harness"'
          ! codex plugin list --json | grep -q '"monolithic-dev-harness@monolithic-dev-harness"'
          test ! -e "$CODEX_HOME/agents/mdh_thermo_review.toml"
          test ! -e "$CODEX_HOME/agents/mdh_thermo_quality.toml"
          test ! -e "$HARNESS_HOME"
