<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Six-stage harness onboarding</title><desc id="desc">Discovery, planning, hardening, preparation, confirmation and execution. Native controls fall back to async then chat. Progress is preserved; suspension disables every harness veto.</desc><rect width="1200" height="700" fill="#f6f8fc"/><g font-family="sans-serif" fill="#17243b"><text x="36" y="38" font-size="24" font-weight="bold">Harness: six stages, one execution confirmation</text><rect x="36" y="60" width="820" height="72" rx="12" fill="#ffffff" stroke="#afbdd2"/><text x="54" y="87" font-size="19" font-weight="bold">1. Discovery</text><text x="54" y="113" font-size="15">Request, ticket, relevant code and evidence</text><path d="M446 134 v17 l-5 -5 m5 5 l5 -5" fill="none" stroke="#526782" stroke-width="2"/><rect x="36" y="153" width="820" height="72" rx="12" fill="#ffffff" stroke="#afbdd2"/><text x="54" y="180" font-size="19" font-weight="bold">2. Planning</text><text x="54" y="206" font-size="15">Choose Light / Standard / Hardcore; shortlist, catalog or recommendations</text><path d="M446 227 v17 l-5 -5 m5 5 l5 -5" fill="none" stroke="#526782" stroke-width="2"/><rect x="36" y="246" width="820" height="72" rx="12" fill="#ffffff" stroke="#afbdd2"/><text x="54" y="273" font-size="19" font-weight="bold">3. Hardening</text><text x="54" y="299" font-size="15">Selected reviews, requirement reconciliation and findings triage</text><path d="M446 320 v17 l-5 -5 m5 5 l5 -5" fill="none" stroke="#526782" stroke-width="2"/><rect x="36" y="339" width="820" height="72" rx="12" fill="#ffffff" stroke="#afbdd2"/><text x="54" y="366" font-size="19" font-weight="bold">4. Preparation</text><text x="54" y="392" font-size="15">Documents + reading manifest + tracker drafts + implementation plan</text><path d="M446 413 v17 l-5 -5 m5 5 l5 -5" fill="none" stroke="#526782" stroke-width="2"/><rect x="36" y="432" width="820" height="72" rx="12" fill="#e2ecff" stroke="#afbdd2"/><text x="54" y="459" font-size="19" font-weight="bold">5. Confirmation</text><text x="54" y="485" font-size="15">One reviewed-bundle decision: approve, revise or pause</text><path d="M446 506 v17 l-5 -5 m5 5 l5 -5" fill="none" stroke="#526782" stroke-width="2"/><rect x="36" y="525" width="820" height="72" rx="12" fill="#ffffff" stroke="#afbdd2"/><text x="54" y="552" font-size="19" font-weight="bold">6. Execution</text><text x="54" y="578" font-size="15">Detect optional versioning; implement, test and review</text><rect x="880" y="60" width="284" height="205" rx="12" fill="#e2f5ed"/><text x="898" y="90" font-size="18" font-weight="bold">Consistent interaction</text><text x="898" y="124" font-size="16">Native buttons first</text><text x="898" y="154" font-size="16">↓ Async native fallback</text><text x="898" y="184" font-size="16">↓ Faithful chat menu</text><text x="898" y="226" font-size="14">Never invent a missing answer</text><rect x="880" y="284" width="284" height="254" rx="12" fill="#fff0d8"/><text x="898" y="314" font-size="18" font-weight="bold">Available throughout</text><text x="898" y="351" font-size="16">Pause · Resume</text><text x="898" y="381" font-size="16">Reset · Restart · Drop</text><text x="898" y="425" font-size="15">Save evidence incrementally</text><text x="898" y="456" font-size="15">Reuse unchanged decisions</text><text x="898" y="498" font-size="15" font-weight="bold">Suspend = no harness veto</text><text x="36" y="659" font-size="16">Revise → affected stage. Pause → preserve bundle. Delivery and merge → context-bound decisions.</text></g></svg>
